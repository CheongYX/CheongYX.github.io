<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>1D Convolution Interactive Demo</title>
<style>
    body { font-family: sans-serif; background-color: #f9fafb; display: flex; flex-direction: column; align-items: center; padding: 20px; color: #333; }
    .demo-container { background: white; padding: 30px 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; }
    h2 { margin-top: 0; color: #2c3e50; font-size: 22px; }
    
    .animation-area { position: relative; margin: 60px auto 20px auto; width: max-content; }
    
    #sliding-kernel { position: absolute; top: -60px; left: -60px; display: flex; gap: 10px; transition: left 0.4s ease-in-out, opacity 0.3s; opacity: 0; }
    
    .array-row { display: flex; gap: 10px; justify-content: center; }
    
    .box { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; border-radius: 8px; box-shadow: inset 0 0 0 2px rgba(0,0,0,0.1); transition: all 0.3s; }
    
    .pad-box { background-color: #f3f4f6; color: #9ca3af; } 
    .input-box { background-color: #e0f2fe; color: #0284c7; } 
    .kernel-box { background-color: #fed7aa; color: #c2410c; box-shadow: 0 4px 6px rgba(0,0,0,0.2); } 
    .result-box { background-color: #bbf7d0; color: #166534; } 
    .empty-result { background-color: #f3f4f6; color: #d1d5db; } 
    
    .active-calc { box-shadow: inset 0 0 0 4px #fbbf24; transform: scale(1.05); }

    .formula-panel { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; margin: 25px auto; width: 90%; font-family: monospace; text-align: center; min-height: 70px; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
    
    .step-text { color: #64748b; font-size: 16px; font-family: sans-serif; }
    .math-text { font-size: 18px; white-space: nowrap; color: #0f172a; } 
    
    .highlight { color: #e11d48; font-weight: bold; font-size: 20px;}
    
    .controls { display: flex; justify-content: center; gap: 15px; margin-top: 10px; }
    button { padding: 10px 20px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
    button:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }
    #prevBtn { background: #f1f5f9; color: #475569; }
    #nextBtn { background: #3b82f6; color: white; }
</style>
</head>
<body>

<div class="demo-container">
    <h2>Interactive: 1D Convolution</h2>
    
    <div class="animation-area">
        <div id="sliding-kernel">
            <div class="box kernel-box">5</div>
            <div class="box kernel-box">4</div>
        </div>
        
        <div class="array-row">
            <div class="box pad-box" id="in-0">0</div>
            <div class="box input-box" id="in-1">1</div>
            <div class="box input-box" id="in-2">2</div>
            <div class="box input-box" id="in-3">3</div>
            <div class="box pad-box" id="in-4">0</div>
        </div>
    </div>

    <div class="formula-panel">
        <div class="step-text" id="f-step">Ready</div>
        <div class="math-text" id="f-math">Click "Next" to start computing</div>
    </div>

    <div class="array-row">
        <div class="box empty-result" id="res-0">?</div>
        <div class="box empty-result" id="res-1">?</div>
        <div class="box empty-result" id="res-2">?</div>
        <div class="box empty-result" id="res-3">?</div>
    </div>

    <div class="controls">
        <button id="prevBtn" onclick="changeStep(-1)" disabled>Previous</button>
        <button id="nextBtn" onclick="changeStep(1)">Next</button>
    </div>
</div>

<script>
    let step = 0; 
    const maxStep = 4; 
    const paddedX = [0, 1, 2, 3, 0];
    const h_flipped = [5, 4];
    const results = [4, 13, 22, 15]; 

    const kernelEl = document.getElementById('sliding-kernel');
    const fStep = document.getElementById('f-step');
    const fMath = document.getElementById('f-math');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function updateUI() {
        prevBtn.disabled = (step === 0);
        nextBtn.disabled = (step === maxStep);

        for(let i = 0; i < 5; i++) document.getElementById(`in-${i}`).classList.remove('active-calc');

        if (step === 0) {
            kernelEl.style.opacity = '0';
            kernelEl.style.left = '-60px'; 
            fStep.innerHTML = 'Ready';
            fMath.innerHTML = 'Click "Next" to start computing';
            resetResults();
            return;
        }

        kernelEl.style.opacity = '1';
        let calcIndex = step - 1; 
        kernelEl.style.left = (calcIndex * 60) + 'px';

        document.getElementById(`in-${calcIndex}`).classList.add('active-calc');
        document.getElementById(`in-${calcIndex + 1}`).classList.add('active-calc');

        const val1 = h_flipped[0] * paddedX[calcIndex];
        const val2 = h_flipped[1] * paddedX[calcIndex + 1];
        
        fStep.innerHTML = `Slide ${step}`;
        fMath.innerHTML = `(<span class="highlight">${h_flipped[0]}</span> × ${paddedX[calcIndex]}) + (<span class="highlight">${h_flipped[1]}</span> × ${paddedX[calcIndex+1]}) = ${val1 + val2}`;

        for (let i = 0; i < 4; i++) {
            const resBox = document.getElementById(`res-${i}`);
            if (i < step) {
                resBox.innerText = results[i];
                resBox.className = "box result-box"; 
            } else {
                resBox.innerText = "?";
                resBox.className = "box empty-result"; 
            }
        }
    }

    function resetResults() {
        for (let i = 0; i < 4; i++) {
            const resBox = document.getElementById(`res-${i}`);
            resBox.innerText = "?";
            resBox.className = "box empty-result";
        }
    }

    function changeStep(delta) {
        step += delta;
        if (step < 0) step = 0;
        if (step > maxStep) step = maxStep;
        updateUI();
    }
</script>

</body>
</html>
